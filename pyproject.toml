[project]
name = "univoice-ai"
version = "0.1.0"
description = "Universal Voice Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "faster-whisper>=1.2,<2.0",
    "av>=11,<19",
    "numpy>=1.26,<3.0",
    "webrtcvad-wheels>=2.0.14.post1,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
