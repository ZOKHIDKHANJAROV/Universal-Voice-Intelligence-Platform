; Local development PJSIP configuration.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Addresses phones must use to reach Asterisk through Docker's port mapping.
; Without the signaling one, Asterisk names its container IP in the Contact of
; its 200 OK, the phone's ACK goes there and never arrives, and the call drops
; after exactly 32 s (SIP timer H). For a phone on another device use the
; laptop's LAN IP in both.
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
external_signaling_port=5060

[1000]
type=endpoint
context=univoice-incoming
disallow=all
allow=ulaw
auth=1000-auth
aors=1000
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Hang up when no audio arrives for 30 s: the caller's phone lost coverage
; without signalling the end of the call.
rtp_timeout=30
rtp_timeout_hold=300

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=change-me

[1000]
type=aor
max_contacts=1
; A phone re-registering after an Asterisk restart replaces its old contact
; instead of being rejected.
remove_existing=yes

; Local test operator: register a second softphone as 1001 to take transfers.
[1001]
type=endpoint
context=univoice-operators
disallow=all
allow=ulaw
auth=1001-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Hang up when no audio arrives for 30 s: the caller's phone lost coverage
; without signalling the end of the call.
rtp_timeout=30
rtp_timeout_hold=300

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=change-me

[1001]
type=aor
max_contacts=1
; A phone re-registering after an Asterisk restart replaces its old contact
; instead of being rejected.
remove_existing=yes

; Machine-specific settings with passwords (GSM gateway, LAN address):
; infrastructure/asterisk/local/*.conf, kept out of git.
#tryinclude local/pjsip_*.conf
