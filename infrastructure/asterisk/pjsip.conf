; Local development PJSIP configuration.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=127.0.0.1

[1000]
type=endpoint
context=univoice-incoming
disallow=all
allow=ulaw
auth=1000-auth
aors=1000
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Hang up when no audio arrives for 30 s: the caller's phone lost coverage
; without signalling the end of the call.
rtp_timeout=30
rtp_timeout_hold=300

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=change-me

[1000]
type=aor
max_contacts=1

; Local test operator: register a second softphone as 1001 to take transfers.
[1001]
type=endpoint
context=univoice-operators
disallow=all
allow=ulaw
auth=1001-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Hang up when no audio arrives for 30 s: the caller's phone lost coverage
; without signalling the end of the call.
rtp_timeout=30
rtp_timeout_hold=300

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=change-me

[1001]
type=aor
max_contacts=1
