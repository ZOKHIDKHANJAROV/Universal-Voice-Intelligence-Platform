[general]
static=yes
writeprotect=no
clearglobals=no

[globals]

[univoice-incoming]
exten => 1000,1,NoOp(UniVoice AI realtime incoming call)
 same => n,Answer()
 same => n,Set(UNIVOICE_CALL_UUID=${UUID()})
 same => n,NoOp(Starting AudioSocket call ${UNIVOICE_CALL_UUID})
 same => n,AudioSocket(${UNIVOICE_CALL_UUID},api:9019)
 same => n,Hangup()

exten => i,1,Hangup()
exten => t,1,Hangup()
exten => #,1,Hangup()
