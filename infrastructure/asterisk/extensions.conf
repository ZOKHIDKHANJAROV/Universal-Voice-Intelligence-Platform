[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[univoice-incoming]
exten => 1000,1,NoOp(UniVoice AI incoming call)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Record(/var/spool/asterisk/recordings/${UNIQUEID}.wav,3,15,qk)
 same => n,NoOp(Sending caller audio to UniVoice API)
 same => n,System(curl -fsS -X POST -F "audio=@/var/spool/asterisk/recordings/${UNIQUEID}.wav" "http://api:8000/api/v1/voice/process?language=uz" -o "/var/lib/univoice/audio/${UNIQUEID}.wav")
 same => n,Playback(/var/lib/univoice/audio/${UNIQUEID})
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()

exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()

exten => #,1,Hangup()
