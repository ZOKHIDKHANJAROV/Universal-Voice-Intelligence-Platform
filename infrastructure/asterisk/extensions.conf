[general]
static=yes
writeprotect=no
clearglobals=no

[globals]

[univoice-incoming]
exten => 1000,1,NoOp(UniVoice AI realtime incoming call)
 same => n,Answer()
 same => n,Set(UNIVOICE_CALL_UUID=${UUID()})
 same => n,NoOp(Starting AudioSocket call ${UNIVOICE_CALL_UUID})
; AudioSocket target: UNIVOICE_AUDIOSOCKET from the environment, else the api
; container. (IF() cannot be used here: it splits its branches on ":".)
 same => n,Set(UNIVOICE_TARGET=${ENV(UNIVOICE_AUDIOSOCKET)})
 same => n,GotoIf($["${UNIVOICE_TARGET}" != ""]?connect)
 same => n,Set(UNIVOICE_TARGET=api:9019)
 same => n(connect),AudioSocket(${UNIVOICE_CALL_UUID},${UNIVOICE_TARGET})
; The bot has let go of the call; ask the API what to do with it.
 same => n,Set(UNIVOICE_API=${ENV(UNIVOICE_API)})
 same => n,GotoIf($["${UNIVOICE_API}" != ""]?ask)
 same => n,Set(UNIVOICE_API=api:8000)
 same => n(ask),Set(UNIVOICE_NEXT=${CURL(http://${UNIVOICE_API}/internal/calls/${UNIVOICE_CALL_UUID}/next)})
 same => n,GotoIf($["${UNIVOICE_NEXT}" = "operator"]?operator)
 same => n,Hangup()
 same => n(operator),Set(UNIVOICE_OPERATOR=${ENV(UNIVOICE_OPERATOR)})
 same => n,GotoIf($["${UNIVOICE_OPERATOR}" != ""]?dial)
 same => n,Set(UNIVOICE_OPERATOR=PJSIP/1001)
 same => n(dial),NoOp(Transferring ${UNIVOICE_CALL_UUID} to ${UNIVOICE_OPERATOR})
 same => n,Dial(${UNIVOICE_OPERATOR},45)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
; Nobody answered (busy, offline, no answer): back to the bot, which apologises.
; If the API is down the reconnect fails and the next lookup hangs up.
 same => n,Set(UNIVOICE_BACK=${CURL(http://${UNIVOICE_API}/internal/calls/${UNIVOICE_CALL_UUID}/operator-unavailable)})
 same => n,Goto(connect)
 same => n(done),Hangup()

exten => i,1,Hangup()
exten => t,1,Hangup()
exten => #,1,Hangup()

; Operators only receive transferred calls; they cannot dial into the bot.
; Calls arriving on the GSM gateway's SIM. Gateways send the SIM's number, a
; fixed extension or "s"; every one of them goes to the bot.
[univoice-gsm]
exten => _X.,1,Goto(univoice-incoming,1000,1)
exten => _+X.,1,Goto(univoice-incoming,1000,1)
exten => s,1,Goto(univoice-incoming,1000,1)

[univoice-operators]
exten => _X.,1,Hangup()
