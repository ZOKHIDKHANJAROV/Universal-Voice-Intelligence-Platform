[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[univoice-incoming]
exten => 1000,1,NoOp(UniVoice incoming call)
 same => n,Answer()
 same => n,Set(TIMEOUT(response)=8)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Playback(hello-world)
 same => n,Background(vm-extension)
 same => n,WaitExten(8)
 same => n,Goto(univoice-menu,1,1)

[univoice-menu]
exten => 1,1,NoOp(Internet problem selected)
 same => n,Playback(demo-abouttotry)
 same => n,Playback(demo-echotest)
 same => n,Hangup()

exten => 2,1,NoOp(Equipment problem selected)
 same => n,Playback(demo-abouttotry)
 same => n,Playback(demo-echotest)
 same => n,Hangup()

exten => 0,1,NoOp(Operator requested)
 same => n,Playback(demo-abouttotry)
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Goto(univoice-menu,1,1)

exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()

exten => #,1,Hangup()
