# Scrapes the UniVoice API. The entrypoint in docker-compose.yml writes the
# target (METRICS_TARGET) and the API key (API_KEY) to files, because
# Prometheus does not read environment variables in its config.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: univoice
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /prometheus/api_key
    file_sd_configs:
      - files: [/prometheus/targets.json]
