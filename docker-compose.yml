services:
  # API, call bridge and web UI: http://localhost:8000/ (console) and /monitor.
  api:
    build:
      context: .
      args:
        INSTALL_GPU: ${INSTALL_GPU:-1}
        CUDA_LIBS_IMAGE: ${CUDA_LIBS_IMAGE:-python:3.12-slim}
    container_name: univoice-api
    env_file:
      - .env
    environment:
      # Same relative paths as on the host (models/..., data/...) work in
      # the container; only the Piper binary lives elsewhere.
      TTS_BINARY: piper
    ports:
      - "8000:8000"
    volumes:
      - voice-audio:/var/lib/univoice/audio
      # Whisper models. Point HF_CACHE_DIR at the host cache
      # (e.g. C:/Users/<you>/.cache/huggingface) to reuse downloaded models.
      - ${HF_CACHE_DIR:-whisper-models}:/root/.cache/huggingface
      # Local models: Uzbek fine-tune, Piper voice.
      - ./models:/app/models:ro
      # Pre-rendered call audio (data/prompts), call log and recordings for /monitor.
      - ./data:/app/data
    restart: unless-stopped
    gpus: all

  # Only needed to (re)render call audio: `make render-prompts`.
  # Keeping it stopped frees ~3 GB of VRAM for Whisper.
  navoiy-tts:
    profiles: ["tts"]
    build:
      context: .
      dockerfile: infrastructure/navoiy-tts/Dockerfile
    container_name: univoice-navoiy-tts
    environment:
      NAVOIY_BASE_MODEL_DIR: /models/CosyVoice2-0.5B
      NAVOIY_CHECKPOINT: /models/navoiy/emotion_600h_joint.pt
      NAVOIY_EMOTIONS_FILE: /models/navoiy/emotions_40h.json
      NAVOIY_REFERENCE_AUDIO: /opt/tts-config/reference.wav
      NAVOIY_MODEL_CACHE: /models/hf-cache
      NAVOIY_BASE_REVISION: eec1ae6c79877dbd9379285cf8789c9e0879293d
      NAVOIY_MODEL_REVISION: 912e6bb6663f11e5dec5de830ca06ea8dd4c985f
      NAVOIY_EMOTION: warm
      NAVOIY_SPEED: "1.0"
    ports:
      - "8100:8100"
    volumes:
      - navoiy-models:/models
      - ./infrastructure/navoiy-tts:/opt/tts-config:ro
      # Code edits apply without rebuilding the 26 GB image.
      - ./infrastructure/navoiy-tts/server.py:/opt/univoice-tts/server.py:ro
    gpus: all
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  asterisk:
    environment:
      # Where Asterisk streams call audio. Set to host.docker.internal:9019
      # when the API runs on the host instead of in the api container.
      UNIVOICE_AUDIOSOCKET: ${UNIVOICE_AUDIOSOCKET:-api:9019}
      # Where the dialplan asks what to do after the bot ("operator" or "hangup").
      UNIVOICE_API: ${UNIVOICE_API:-api:8000}
      # Who takes "press 0" / "operator" transfers: a SIP endpoint, or
      # PJSIP/<number>@<trunk> once a provider trunk exists.
      UNIVOICE_OPERATOR: ${UNIVOICE_OPERATOR:-PJSIP/1001}
    build:
      context: .
      dockerfile: infrastructure/asterisk/Dockerfile
    container_name: univoice-asterisk
    depends_on:
      - api
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./infrastructure/asterisk/asterisk.conf:/etc/asterisk/asterisk.conf:ro
      - ./infrastructure/asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./infrastructure/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./infrastructure/asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./infrastructure/asterisk/modules.conf:/etc/asterisk/modules.conf:ro
      - asterisk-recordings:/var/spool/asterisk/recordings
      - voice-audio:/var/lib/univoice/audio
    restart: unless-stopped

volumes:
  asterisk-recordings:
  voice-audio:
  navoiy-models:
  whisper-models:
